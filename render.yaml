services:
  - type: web
    name: ai-news-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

  - type: cron
    name: news-crawler
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.crawler.run
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEWS_API_KEY
        sync: false

  - type: web
    name: ai-news-frontend
    runtime: static
    staticPublishPath: ./frontend
    buildCommand: echo "static site"
